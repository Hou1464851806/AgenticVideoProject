name: agenticvideo
services:
  postgres:
    image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    platform: linux/arm64
    environment:
      POSTGRES_DB: agentic_video
      POSTGRES_USER: agentic_video
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Run scripts/start.sh to create local configuration}
    volumes:
      - postgres_data:/var/lib/postgresql
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U agentic_video -d agentic_video']
      interval: 3s
      timeout: 3s
      retries: 20
  business-api:
    build:
      context: .
      dockerfile: backend/business-api/Dockerfile
    platform: linux/arm64
    ports:
      - '127.0.0.1:${APP_PORT:-8080}:8080'
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/agentic_video
      DATABASE_USER: agentic_video
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      APP_ALLOWED_ORIGIN: ${APP_ALLOWED_ORIGIN:-http://localhost:8080}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 768m
    cpus: 1.5
volumes:
  postgres_data:
