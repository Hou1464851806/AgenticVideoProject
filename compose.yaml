name: agenticvideo
services:
  qdrant:
    image: qdrant/qdrant:v1.19.2@sha256:b7b0444c4c351c970b98e90a6f89c2ee4287c65b44e52b4cb503fa5b2aa927ad
    platform: linux/arm64
    volumes:
      - qdrant_data:/qdrant/storage
    mem_limit: 512m
    cpus: 1
  postgres:
    image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    platform: linux/arm64
    environment:
      POSTGRES_DB: agentic_video
      POSTGRES_USER: agentic_video
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Run scripts/start.sh to create local configuration}
    volumes:
      - postgres_data:/var/lib/postgresql
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U agentic_video -d agentic_video']
      interval: 3s
      timeout: 3s
      retries: 20
  silo:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    platform: linux/arm64
    command: [server, /data, --console-address, ':9001']
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    environment:
      MINIO_ROOT_USER: agentic-storage
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:?Run scripts/start.sh to configure storage}
      MINIO_API_MULTIPART_LISTING: strict
    volumes:
      - silo_data:/data
    mem_limit: 512m
    cpus: 1
  rabbitmq:
    image: rabbitmq:4.3.6-management@sha256:8dd6e3570ddaa2ef82a6c3a8950e79c1f73893adfbdddbc374fc1f1ac8a0f5dd
    platform: linux/arm64
    environment:
      RABBITMQ_DEFAULT_USER: agentic-worker
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Run scripts/start.sh to configure messaging}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: '+S 2:2'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 5s
      timeout: 5s
      retries: 20
  business-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    platform: linux/arm64
    ports:
      - '127.0.0.1:${APP_PORT:-8080}:8080'
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/agentic_video
      DATABASE_USER: agentic_video
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: agentic-worker
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      INTERNAL_WORKER_TOKEN: ${INTERNAL_WORKER_TOKEN}
      TASKS_DISPATCH_ENABLED: 'true'
      MEDIA_WORK_DIRECTORY: /work
      LEGACY_AGENT_ENABLED: 'false'
      LEGACY_WORKER_ENABLED: 'false'
      ANALYSIS_EXECUTION_ENABLED: ${ANALYSIS_EXECUTION_ENABLED:-true}
      ANALYSIS_CONSUMER_CONCURRENCY: ${ANALYSIS_CONSUMER_CONCURRENCY:-2}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/api/v1}
      MODEL_RECORD_REQUEST_MAX_BYTES: ${MODEL_RECORD_REQUEST_MAX_BYTES:-16777216}
      MODEL_RECORD_RESPONSE_MAX_BYTES: ${MODEL_RECORD_RESPONSE_MAX_BYTES:-4194304}
      APP_ALLOWED_ORIGIN: ${APP_ALLOWED_ORIGIN:-http://localhost:8080}
      STORAGE_ENDPOINT: http://silo:9000
      STORAGE_PUBLIC_ENDPOINT: http://localhost:9000
      STORAGE_ACCESS_KEY: agentic-storage
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_PART_URL_SECONDS: ${STORAGE_PART_URL_SECONDS:-300}
      CAPACITY_PATHS: /capacity/silo,/work
      CAPACITY_MAX_RESERVED_BYTES: ${CAPACITY_MAX_RESERVED_BYTES:-9223372036854775807}
      CAPACITY_MIN_FREE_BYTES: ${CAPACITY_MIN_FREE_BYTES:-536870912}
      UPLOAD_MAX_FILE_BYTES: ${UPLOAD_MAX_FILE_BYTES:-2147483648}
      UPLOAD_MAX_PROJECT_BYTES: ${UPLOAD_MAX_PROJECT_BYTES:-5368709120}
      UPLOAD_MAX_PROJECT_ASSETS: ${UPLOAD_MAX_PROJECT_ASSETS:-10}
      UPLOAD_INACTIVITY_SECONDS: ${UPLOAD_INACTIVITY_SECONDS:-86400}
      UPLOAD_CLEANUP_SETTLE_SECONDS: ${UPLOAD_CLEANUP_SETTLE_SECONDS:-30}
      UPLOAD_CLEANUP_INTERVAL_MS: ${UPLOAD_CLEANUP_INTERVAL_MS:-10000}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65
    volumes:
      - silo_data:/capacity/silo:ro
      - worker_work:/work
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8080/api/v1/auth/csrf]
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 1280m
    cpus: 2
volumes:
  qdrant_data:
  postgres_data:
  silo_data:
  rabbitmq_data:
  worker_work:
