name: agenticvideo
services:
  postgres:
    image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    platform: linux/arm64
    environment:
      POSTGRES_DB: agentic_video
      POSTGRES_USER: agentic_video
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Run scripts/start.sh to create local configuration}
    volumes:
      - postgres_data:/var/lib/postgresql
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U agentic_video -d agentic_video']
      interval: 3s
      timeout: 3s
      retries: 20
  silo:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    platform: linux/arm64
    command: [server, /data]
    ports:
      - '127.0.0.1:9000:9000'
    environment:
      MINIO_ROOT_USER: agentic-storage
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:?Run scripts/start.sh to configure storage}
      MINIO_API_MULTIPART_LISTING: strict
    volumes:
      - silo_data:/data
    mem_limit: 512m
    cpus: 1
  rabbitmq:
    image: rabbitmq:4.3.6-management@sha256:8dd6e3570ddaa2ef82a6c3a8950e79c1f73893adfbdddbc374fc1f1ac8a0f5dd
    platform: linux/arm64
    environment:
      RABBITMQ_DEFAULT_USER: agentic-worker
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Run scripts/start.sh to configure messaging}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: '+S 2:2'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 5s
      timeout: 5s
      retries: 20
  media-worker:
    build:
      context: .
      dockerfile: backend/media-worker/Dockerfile
    platform: linux/arm64
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: agentic-worker
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      INTERNAL_WORKER_TOKEN: ${INTERNAL_WORKER_TOKEN}
      STORAGE_ENDPOINT: http://silo:9000
      STORAGE_ACCESS_KEY: agentic-storage
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65
    volumes:
      - worker_work:/work
    depends_on:
      business-api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    mem_limit: 512m
    cpus: 1
  agent-service:
    build:
      context: .
      dockerfile: agent-service/Dockerfile
    platform: linux/arm64
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: agentic-worker
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      INTERNAL_WORKER_TOKEN: ${INTERNAL_WORKER_TOKEN}
      STORAGE_ENDPOINT: http://silo:9000
      STORAGE_ACCESS_KEY: agentic-storage
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/api/v1}
    volumes:
      - agent_work:/work
    depends_on:
      business-api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8082/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
  business-api:
    build:
      context: .
      dockerfile: backend/business-api/Dockerfile
    platform: linux/arm64
    ports:
      - '127.0.0.1:${APP_PORT:-8080}:8080'
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/agentic_video
      DATABASE_USER: agentic_video
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: agentic-worker
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      INTERNAL_WORKER_TOKEN: ${INTERNAL_WORKER_TOKEN}
      TASKS_DISPATCH_ENABLED: 'true'
      APP_ALLOWED_ORIGIN: ${APP_ALLOWED_ORIGIN:-http://localhost:8080}
      STORAGE_ENDPOINT: http://silo:9000
      STORAGE_PUBLIC_ENDPOINT: http://localhost:9000
      STORAGE_ACCESS_KEY: agentic-storage
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_PART_URL_SECONDS: ${STORAGE_PART_URL_SECONDS:-300}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8080/api/v1/auth/csrf]
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 768m
    cpus: 1.5
volumes:
  postgres_data:
  silo_data:
  rabbitmq_data:
  worker_work:
  agent_work:
