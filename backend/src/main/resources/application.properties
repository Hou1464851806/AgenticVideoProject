spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/agentic_video}
spring.datasource.username=${DATABASE_USER:agentic_video}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=8h
app.allowed-origin=${APP_ALLOWED_ORIGIN:http://localhost:8080}
storage.endpoint=${STORAGE_ENDPOINT:http://localhost:9000}
storage.public-endpoint=${STORAGE_PUBLIC_ENDPOINT:http://localhost:9000}
storage.access-key=${STORAGE_ACCESS_KEY:unconfigured}
storage.secret-key=${STORAGE_SECRET_KEY:unconfigured}
storage.part-url-seconds=${STORAGE_PART_URL_SECONDS:300}
spring.rabbitmq.publisher-confirm-type=simple
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
internal.worker-token=${INTERNAL_WORKER_TOKEN:}
tasks.dispatch-enabled=${TASKS_DISPATCH_ENABLED:false}

conversation.model-record.request-max-bytes=${MODEL_RECORD_REQUEST_MAX_BYTES:16777216}
conversation.model-record.response-max-bytes=${MODEL_RECORD_RESPONSE_MAX_BYTES:4194304}

upload.max-file-bytes=${UPLOAD_MAX_FILE_BYTES:2147483648}
upload.max-project-bytes=${UPLOAD_MAX_PROJECT_BYTES:5368709120}
upload.max-project-assets=${UPLOAD_MAX_PROJECT_ASSETS:10}
capacity.paths=${CAPACITY_PATHS:${java.io.tmpdir}}
capacity.min-free-bytes=${CAPACITY_MIN_FREE_BYTES:536870912}
capacity.max-reserved-bytes=${CAPACITY_MAX_RESERVED_BYTES:9223372036854775807}

conversation.events.retention-seconds=${PUBLIC_EVENT_RETENTION_SECONDS:604800}
conversation.drafts.retention-seconds=${ASSISTANT_DRAFT_RETENTION_SECONDS:604800}
conversation.events.cleanup-ms=${PUBLIC_EVENT_CLEANUP_MS:60000}
conversation.events.cleanup-enabled=${PUBLIC_EVENT_CLEANUP_ENABLED:${tasks.dispatch-enabled:false}}

# Local consumers execute synchronously; no acknowledgement before durable stage publication.
tasks.consume-enabled=${TASKS_CONSUME_ENABLED:${tasks.dispatch-enabled:false}}
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.default-requeue-rejected=false
media.work-directory=${MEDIA_WORK_DIRECTORY:${java.io.tmpdir}/agentic-video-media}
storage.bucket=${STORAGE_BUCKET:originals}
legacy.worker-enabled=${LEGACY_WORKER_ENABLED:false}
legacy.agent-enabled=${LEGACY_AGENT_ENABLED:false}
analysis.execution-enabled=${ANALYSIS_EXECUTION_ENABLED:false}
legacy.inspection-enabled=${LEGACY_INSPECTION_ENABLED:false}

analysis.consumer-concurrency=${ANALYSIS_CONSUMER_CONCURRENCY:2}
analysis.asr-query-seconds=${ASR_QUERY_SECONDS:5}

# Upload admission uses bounded calls while holding user/project SQL locks.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:300ms}
spring.data.redis.timeout=${REDIS_COMMAND_TIMEOUT:300ms}
upload.admission.capacity=${UPLOAD_ADMISSION_CAPACITY:3}
upload.admission.period-ms=${UPLOAD_ADMISSION_PERIOD_MS:60000}
