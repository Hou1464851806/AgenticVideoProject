server.port=8081
spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.username=${RABBITMQ_USER:agentic-worker}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=1
worker.business-url=${BUSINESS_API_URL:http://business-api:8080}
worker.token=${INTERNAL_WORKER_TOKEN:}
worker.storage-endpoint=${STORAGE_ENDPOINT:http://silo:9000}
worker.storage-access-key=${STORAGE_ACCESS_KEY:agentic-storage}
worker.storage-secret-key=${STORAGE_SECRET_KEY:}
worker.storage-bucket=${STORAGE_BUCKET:originals}
