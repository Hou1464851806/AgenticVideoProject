spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/agentic_video}
spring.datasource.username=${DATABASE_USER:agentic_video}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=8h
app.allowed-origin=${APP_ALLOWED_ORIGIN:http://localhost:8080}
storage.endpoint=${STORAGE_ENDPOINT:http://localhost:9000}
storage.public-endpoint=${STORAGE_PUBLIC_ENDPOINT:http://localhost:9000}
storage.access-key=${STORAGE_ACCESS_KEY:unconfigured}
storage.secret-key=${STORAGE_SECRET_KEY:unconfigured}
storage.part-url-seconds=${STORAGE_PART_URL_SECONDS:300}
spring.rabbitmq.publisher-confirm-type=simple
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
internal.worker-token=${INTERNAL_WORKER_TOKEN:}
tasks.dispatch-enabled=${TASKS_DISPATCH_ENABLED:false}

conversation.model-record.request-max-bytes=${MODEL_RECORD_REQUEST_MAX_BYTES:16777216}
conversation.model-record.response-max-bytes=${MODEL_RECORD_RESPONSE_MAX_BYTES:4194304}
